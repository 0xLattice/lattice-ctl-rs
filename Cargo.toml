[package]
name = "lattice-ctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[[bin]]
name = "lattice"
path = "src/main.rs"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lattice-mining = { path = "../lattice-mining-rs" }
lattice-sdk = { path = "../lattice-sdk-rs" }
lattice-validation = { path = "../lattice-rs/crates/lattice-validation" }
lattice-cashew = { path = "../cashew-rs" }
fs2 = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "io-util"] }
tokio-util = "0.7"
url = "2"
[target.'cfg(unix)'.dependencies]
lattice-node = { path = "../lattice-node-rs" }
lattice-wasm = { path = "../lattice-rs/crates/lattice-wasm" }
libc = "0.2"
